<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="vendor/hljs-light.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/hljs-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="app.css">
</head>
<body class="empty">
<!-- Icons, drawn once and referenced with <use>. 16×16, stroked with currentColor. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-send" viewBox="0 0 16 16"><path d="M8 13V3.5M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 5.5V4.3A1.8 1.8 0 0 0 8.7 2.5H4.3A1.8 1.8 0 0 0 2.5 4.3v4.4a1.8 1.8 0 0 0 1.8 1.8h1.2" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7m0-7-7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-retry" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-open" viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 7.5 8.5M12 9.5v2.7a1.3 1.3 0 0 1-1.3 1.3H3.8a1.3 1.3 0 0 1-1.3-1.3V5.3A1.3 1.3 0 0 1 3.8 4h2.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-new" viewBox="0 0 16 16"><path d="M7.5 2.5H4a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 4 13.5h8a1.5 1.5 0 0 0 1.5-1.5V8.5M12.2 2.3a1.2 1.2 0 0 1 1.6 1.6L8.4 9.3l-2.2.6.6-2.2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div id="app">
  <div id="thread"></div>
  <div id="composer">
    <div id="context" class="card" hidden></div>
    <div id="axhint" class="card" hidden>
      <div class="card-body"><div class="card-text">Select text in any app before pressing the hotkey to ask about it. This needs Accessibility access.</div></div>
      <button class="link" data-ax="open">Allow…</button>
      <button class="icon" data-ax="dismiss" aria-label="Dismiss" title="Dismiss"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="prompt-row">
      <textarea id="input" rows="1" placeholder="Ask Claude" autofocus spellcheck="false"></textarea>
      <button id="send" class="send" aria-label="Send" title="Send (↵)"><svg><use href="#i-send"/></svg></button>
    </div>
    <div class="toolbar">
      <div id="models" class="models"></div>
      <span id="toast"></span>
      <span id="hint" class="hint" hidden>hold <kbd>⌘</kbd> for shortcuts</span>
      <span id="tools" class="tools">
        <button id="handoff" class="icon" aria-label="Open in app"><svg><use href="#i-open"/></svg></button>
        <button id="new" class="icon" aria-label="New chat" title="New chat (⌘N)"><svg><use href="#i-new"/></svg></button>
      </span>
      <span id="legend" class="legend"></span>
    </div>
  </div>
</div>
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/texmath.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
