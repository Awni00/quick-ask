<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8F1"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232A44"/>
      <stop offset="1" stop-color="#11152A"/>
    </linearGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#11152A"/>
      <stop offset="0.55" stop-color="#4B5BF2"/>
      <stop offset="1" stop-color="#1FB6E3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2140" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#1B2140" stroke-opacity="0.06" stroke-width="2"/>
  <g filter="url(#shadow)">
    <path fill="url(#ink)" fill-rule="evenodd" d="
      M190,450 A260,260 0 1,1 710,450 A260,260 0 1,1 190,450 Z
      M270,450 A180,194 0 1,0 630,450 A180,194 0 1,0 270,450 Z"/>
    <!-- tail breaks into a decelerating stream: quick, and streamed -->
    <g transform="rotate(45 450 450)" stroke-linecap="round" fill="none">
      <line x1="628" y1="450" x2="780" y2="450" stroke="url(#trail)" stroke-width="80"/>
      <line x1="870" y1="450" x2="905" y2="450" stroke="url(#trail)" stroke-width="58"/>
      <circle cx="975" cy="450" r="22" fill="url(#trail)" stroke="none"/>
    </g>
  </g>
</svg>
