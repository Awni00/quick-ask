<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26304F"/>
      <stop offset="1" stop-color="#0D1222"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E6F0"/>
    </linearGradient>
    <linearGradient id="ans" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF5DC"/>
      <stop offset="1" stop-color="#3FA9F5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD1E8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4FD1E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="496" cy="482" r="180" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <!-- Q: ring with stress (sides 82, top/bottom 68) -->
    <path fill="url(#ink)" fill-rule="evenodd" d="
      M228,488 A272,272 0 1,1 772,488 A272,272 0 1,1 228,488 Z
      M310,488 A190,204 0 1,0 690,488 A190,204 0 1,0 310,488 Z"/>
    <!-- Q tail: a tapered swash that starts inside the counter and sweeps out to the right -->
    <path fill="url(#ink)" d="M512,632 C600,676 690,716 822,722 Q834,723 832,735 L829,748 Q827,758 815,758 C670,762 556,744 474,704 Z"/>
    <!-- lowercase a nested in the counter: the answer inside the question -->
    <path fill="url(#ans)" fill-rule="evenodd" d="
      M402,478 A92,92 0 1,1 586,478 A92,92 0 1,1 402,478 Z
      M441,478 A53,57 0 1,0 547,478 A53,57 0 1,0 441,478 Z"/>
    <rect x="547" y="386" width="39" height="184" fill="url(#ans)"/>
  </g>
</svg>
