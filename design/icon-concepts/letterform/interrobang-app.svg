<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4E46D8"/>
      <stop offset="1" stop-color="#1D2C7A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ans" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6F4FF"/>
      <stop offset="1" stop-color="#5EEAC0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A0F3A" flood-opacity="0.4"/>
    </filter>
    <!-- the exclamation stem cuts a clean channel through the question hook -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <path id="stemShape" d="M470,183 L554,183 L535,640 L489,640 Z" fill="#000" stroke="#000" stroke-width="26" stroke-linejoin="round"/>
      <rect x="300" y="540" width="250" height="160" fill="#000"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <g filter="url(#shadow)">
    <!-- question: the hook -->
    <path mask="url(#cut)" fill="none" stroke="#FFFFFF" stroke-width="82" stroke-linecap="butt" d="
      M356,392 C356,290 428,224 512,224 C600,224 668,284 668,362
      C668,440 620,474 574,504 C536,528 512,556 512,610"/>
    <!-- exclamation: the answer, a tapered stem struck through the hook; the shared dot carries the accent -->
    <path fill="#FFFFFF" d="M470,197 Q470,183 484,183 L540,183 Q554,183 554,197 L535,626 Q534,644 517,644 L507,644 Q490,644 489,626 Z"/>
    <circle cx="512" cy="768" r="52" fill="url(#ans)"/>
  </g>
</svg>
