<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e3d6e"/>
      <stop offset="1" stop-color="#111832"/>
    </linearGradient>
    <radialGradient id="spot" cx="512" cy="420" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f8fe8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6f8fe8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="chrome" x1="268" y1="0" x2="756" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c5570"/>
      <stop offset=".14" stop-color="#9fabc3"/>
      <stop offset=".3" stop-color="#f4f7fc"/>
      <stop offset=".42" stop-color="#c2cbdc"/>
      <stop offset=".62" stop-color="#7a86a0"/>
      <stop offset=".84" stop-color="#b3bdd1"/>
      <stop offset="1" stop-color="#454e68"/>
    </linearGradient>
    <linearGradient id="domeShade" x1="0" y1="506" x2="0" y2="722" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a1024" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="lip" x1="274" y1="0" x2="750" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a4259"/>
      <stop offset=".3" stop-color="#d9dfea"/>
      <stop offset=".6" stop-color="#6d7891"/>
      <stop offset="1" stop-color="#363d53"/>
    </linearGradient>
    <linearGradient id="baseSide" x1="0" y1="708" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26305a"/>
      <stop offset="1" stop-color="#121833"/>
    </linearGradient>
    <linearGradient id="baseTop" x1="0" y1="658" x2="0" y2="758" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56669e"/>
      <stop offset="1" stop-color="#3a4676"/>
    </linearGradient>
    <linearGradient id="ding" x1="0" y1="280" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fe6ff"/>
      <stop offset="1" stop-color="#a99bff"/>
    </linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#spot)"/>
    <!-- contact shadow -->
    <ellipse cx="512" cy="792" rx="300" ry="40" fill="#05081a" opacity=".7" filter="url(#blur30)"/>
  </g>

  <!-- base (cylinder) -->
  <path d="M228 708 v40 a284 50 0 0 0 568 0 v-40 z" fill="url(#baseSide)"/>
  <ellipse cx="512" cy="708" rx="284" ry="50" fill="url(#baseTop)"/>
  <path d="M228 708 a284 50 0 0 0 568 0" fill="none" stroke="#8fa3e6" stroke-opacity=".35" stroke-width="3"/>

  <!-- shadow of dome on base -->
  <ellipse cx="522" cy="712" rx="256" ry="36" fill="#070b1c" opacity=".55" filter="url(#blur8)"/>

  <!-- rim lip -->
  <ellipse cx="512" cy="694" rx="254" ry="40" fill="url(#lip)"/>

  <!-- dome -->
  <path d="M268 686 C268 572 378 506 512 506 C646 506 756 572 756 686 a244 36 0 0 1 -488 0 z" fill="url(#chrome)"/>
  <path d="M268 686 C268 572 378 506 512 506 C646 506 756 572 756 686 a244 36 0 0 1 -488 0 z" fill="url(#domeShade)"/>
  <!-- specular streak -->
  <path d="M356 660 C346 600 376 548 432 528 C396 566 384 610 390 662 z" fill="#ffffff" opacity=".85" filter="url(#blur8)"/>
  <!-- cool reflection of the ding glow on dome crown -->
  <ellipse cx="512" cy="520" rx="90" ry="14" fill="#9fd8ff" opacity=".45" filter="url(#blur8)"/>

  <!-- stem -->
  <rect x="504" y="436" width="16" height="76" fill="url(#chrome)"/>
  <rect x="504" y="436" width="16" height="76" fill="#0a1024" opacity=".25"/>
  <!-- plunger -->
  <path d="M462 432 v12 a50 13 0 0 0 100 0 v-12 z" fill="#5d6884"/>
  <ellipse cx="512" cy="432" rx="50" ry="13" fill="#e9eef7"/>
  <ellipse cx="500" cy="429" rx="24" ry="4.5" fill="#ffffff"/>

  <!-- ding -->
  <g fill="none" stroke="url(#ding)" stroke-width="22" stroke-linecap="round">
    <g filter="url(#glow)" opacity=".7">
      <path d="M609.8 411.2 A100 100 0 0 0 573.6 353.2"/>
      <path d="M657.5 395.7 A150 150 0 0 0 612.4 320.5"/>
      <path d="M414.2 411.2 A100 100 0 0 1 450.4 353.2"/>
      <path d="M366.5 395.7 A150 150 0 0 1 411.6 320.5"/>
    </g>
    <path d="M609.8 411.2 A100 100 0 0 0 573.6 353.2"/>
    <path d="M657.5 395.7 A150 150 0 0 0 612.4 320.5"/>
    <path d="M414.2 411.2 A100 100 0 0 1 450.4 353.2"/>
    <path d="M366.5 395.7 A150 150 0 0 1 411.6 320.5"/>
  </g>
</svg>
