<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <defs>
    <mask id="knock" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <rect x="4.6" y="6" width="14" height="11.6" rx="3" fill="#000"/>
    </mask>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <circle cx="8.6" cy="10.1" r="1.15" fill="#000"/>
      <rect x="10.6" y="9.45" width="4.2" height="1.3" rx=".65" fill="#000"/>
      <rect x="7.4" y="12.6" width="7.4" height="1.3" rx=".65" fill="#000"/>
    </mask>
  </defs>
  <!-- the work: a page, behind -->
  <g mask="url(#knock)">
    <rect x="1.65" y="1.65" width="9.7" height="12.2" rx="1.8" fill="none" stroke="#000" stroke-width="1.3"/>
    <rect x="3.8" y="4.4" width="5.2" height="1.2" rx=".6" fill="#000"/>
  </g>
  <!-- the aside pane, floating over it -->
  <rect x="6" y="7.4" width="11.2" height="8.8" rx="2.2" fill="#000" mask="url(#cut)"/>
</svg>
