<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef2fd"/>
      <stop offset="1" stop-color="#bcc8f2"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <radialGradient id="ball" cx="410" cy="360" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a6684"/>
      <stop offset=".35" stop-color="#232a42"/>
      <stop offset=".8" stop-color="#0c0f1c"/>
      <stop offset="1" stop-color="#05060c"/>
    </radialGradient>
    <radialGradient id="rim" cx="512" cy="500" r="290" gradientUnits="userSpaceOnUse">
      <stop offset=".82" stop-color="#7fa4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fa4ff" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="spec" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="420" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03040a"/>
      <stop offset="1" stop-color="#4b5674"/>
    </linearGradient>
    <radialGradient id="liquid" cx="560" cy="600" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3cc8e8"/>
      <stop offset=".55" stop-color="#3a5be0"/>
      <stop offset="1" stop-color="#1b1c6e"/>
    </radialGradient>
    <linearGradient id="die" x1="0" y1="480" x2="0" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7f0ff"/>
      <stop offset="1" stop-color="#7d8cff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#body)">
    <ellipse cx="524" cy="812" rx="230" ry="34" fill="#1b2350" opacity=".45" filter="url(#soft)"/>
  </g>

  <!-- ball -->
  <circle cx="512" cy="500" r="300" fill="url(#ball)"/>
  <circle cx="512" cy="500" r="300" fill="url(#rim)"/>

  <!-- window -->
  <circle cx="550" cy="560" r="156" fill="url(#bezel)"/>
  <circle cx="550" cy="560" r="142" fill="url(#liquid)"/>
  <circle cx="550" cy="560" r="142" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="10" filter="url(#b6)"/>
  <!-- glow behind die -->
  <circle cx="550" cy="548" r="92" fill="#9fe9ff" opacity=".55" filter="url(#b14)"/>
  <!-- die (triangle pointing down) -->
  <path d="M446 500 L654 500 L550 678 Z" fill="url(#die)" stroke="url(#die)" stroke-width="22" stroke-linejoin="round"/>
  <!-- question mark on die -->
  <g fill="none" stroke="#1d2a8a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M524 530 C524 506 576 506 576 532 C576 552 550 553 550 574 L550 578"/>
  </g>
  <circle cx="550" cy="606" r="11" fill="#1d2a8a"/>

  <!-- glass highlight over the window -->
  <path d="M428 520 A142 142 0 0 1 562 420 A166 166 0 0 0 446 542 Z" fill="#ffffff" opacity=".22"/>

  <!-- ball specular -->
  <ellipse cx="0" cy="0" rx="1" ry="1" fill="url(#spec)" transform="translate(400 330) rotate(-35) scale(130 70)"/>
  <ellipse cx="0" cy="0" rx="1" ry="1" fill="url(#spec)" opacity=".9" transform="translate(388 322) rotate(-35) scale(46 22)"/>
</svg>
